name: projecto_edumap
description: "EduMap - Plataforma educativa offline para estudantes moçambicanos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Ícones
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  google_sign_in: ^7.2.0
  
  # Gerenciamento de estado
  provider: ^6.1.2
  
  # Utilidades
  connectivity_plus: ^7.1.1
  path_provider: ^2.1.5
  file_picker: ^12.0.0-beta.4
  
  # Visualizadores
  flutter_pdfview: ^1.3.2
  video_player: ^2.8.2
  chewie: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true