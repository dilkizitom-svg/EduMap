name: projecto_edumap
description: "EduMap - Plataforma educativa offline para estudantes moçambicanos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Ícones
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.3.0
  
  # Gerenciamento de estado
  provider: ^6.1.2
  
  # Utilidades
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true